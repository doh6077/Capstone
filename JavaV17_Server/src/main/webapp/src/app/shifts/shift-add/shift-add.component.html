<h3>Add Shift</h3>
<div class="card">
  <div class="card-body">
    <div class="form-group">
      <label>day of Week:</label>
      <input class="form-control" id="dayOfWeek" type="text" name="dayOfWeek" [(ngModel)]="shift.dayOfWeek" />
    <div class = "form-group">
        <label th:for="dayOfWeek"></label>
        <select th:field="*{dayOfWeek}">
            <option th:each ="dayOfWeek : ${dayOfWeek}"></option>

        </select>
    </div>
    <div class = "form-group">
        <label th:for="shiftTime"></label>
        <select th:field="*{shiftTime}">

        </select>
    </div>
      <label>shift Time:</label>
      <input class="form-control" id="shiftTime" type="text" name="shiftTime" [(ngModel)]="shift.shiftTime" />

    <button class="btn btn-success mt-3" (click)="saveShift()">Submit</button>
    </div>
  </div>
</div>
<p class="mt-3"><a routerLink="/shifts">Back to shift page</a></p>
